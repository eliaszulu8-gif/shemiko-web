<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3A82">
<meta name="description" content="Farm records for crops, poultry, workers and money. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Shemiko Farm Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column, four tabs + add button on a bottom bar, bottom sheets for entry. Indigo cloth + millet gold. */
:root{
  --bg:#ECEEE6; --surface:#F8F9F4; --line:#D5D9CB; --ink:#1C2540; --muted:#5D6578;
  --indigo:#2B3A82; --on-indigo:#FFFFFF; --gold:#C98A12; --gold-soft:#F3E3BC; --good:#2F7D4F; --bad:#B23B2E; --warn:#9A6700;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12162A; --surface:#1B2038; --line:#2E3554; --ink:#E7E9F2; --muted:#9AA1B8;
  --indigo:#93A4F5; --on-indigo:#12162A; --gold:#E7B24A; --gold-soft:#3A3120; --good:#5EC08A; --bad:#EE7D70; --warn:#E7B24A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12162A; --surface:#1B2038; --line:#2E3554; --ink:#E7E9F2; --muted:#9AA1B8;
  --indigo:#93A4F5; --on-indigo:#12162A; --gold:#E7B24A; --gold-soft:#3A3120; --good:#5EC08A; --bad:#EE7D70; --warn:#E7B24A; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:460px;margin:0 auto;padding-block:16px 110px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:.85rem}

.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.status.off i{background:var(--warn)}
.tools{display:flex;gap:6px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;font:700 .78rem var(--body);padding:5px 10px;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--indigo);color:var(--on-indigo)}
.langsel{font:700 .78rem var(--body);padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:140px}
.draftnote{font-size:.78rem;background:var(--gold-soft);border-radius:8px;padding:6px 10px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:700 .78rem var(--body);padding:5px 11px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.iconbtn svg{width:14px;height:14px}
header.top{display:flex;flex-direction:column;gap:2px}
.demo{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo button{background:none;border:0;color:var(--indigo);font:inherit;font-weight:700;padding:0;cursor:pointer;text-decoration:underline}

.net{background:var(--indigo);color:var(--on-indigo);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.net .big{font-family:var(--display);font-size:2.3rem;font-weight:800;line-height:1}
.net .big small{font-size:.9rem;font-weight:500;opacity:.8;margin-left:6px}
.net .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.85rem}
.net .row div{display:flex;flex-direction:column;min-width:0}
.net .row b{font-family:var(--mono);font-size:1rem}
.net .eyebrow{color:inherit;opacity:.78}

section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;color:var(--indigo);font:700 .85rem var(--body);cursor:pointer;padding:4px 0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.item .s{font-size:.82rem;color:var(--muted)}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92rem;white-space:nowrap}
.amt.in{color:var(--good)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;flex:none;display:grid;place-items:center;color:transparent}
.tick:hover{border-color:var(--indigo)}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.done .t{text-decoration:line-through;color:var(--muted)}
.due{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.due.late{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.due.soon{background:var(--gold-soft);color:var(--warn)}
.due.later{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
.due.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}

.plots{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .ttl{font-family:var(--display);font-weight:700;font-size:1.1rem}
.card .meta{font-size:.82rem;color:var(--muted)}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stages span{height:8px;border-radius:2px;background:var(--line)}
.stages span.on{background:var(--gold)}
.stages span.cur{background:var(--indigo)}
.stagelbl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.stagelbl b{color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-family:var(--mono);font-size:.86rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pos{color:var(--good)} .neg{color:var(--bad)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--good)}

.bars{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;font-size:.82rem}
.bar-row .lbl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{display:flex;flex-direction:column;gap:3px}
.track i{display:block;height:9px;border-radius:2px;min-width:2px}
.track i.c{background:var(--muted);opacity:.55}
.track i.r{background:var(--gold)}
.legend{display:flex;gap:16px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .c::before{background:var(--muted);opacity:.55}
.legend .r::before{background:var(--gold)}
.legend .b::before{background:none;border:2px solid var(--ink);width:6px;height:6px}

.budget-row{display:flex;flex-direction:column;gap:5px}
.budget-row .top{display:flex;justify-content:space-between;font-size:.85rem;gap:8px}
.budget-row .top b{font-weight:700}
.btrack{position:relative;height:12px;border-radius:3px;background:var(--line);overflow:visible}
.btrack i{display:block;height:100%;border-radius:3px;background:var(--indigo)}
.btrack i.over{background:var(--bad)}
.btrack u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-top:0}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--body);font-weight:700}
tr.total td{font-weight:700;background:color-mix(in srgb,var(--gold) 10%,transparent)}

.score{display:flex;gap:14px;align-items:center}
.ring{width:72px;height:72px;flex:none}
.score ul{margin:0;padding-left:18px;font-size:.82rem;color:var(--muted)}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:8px;font:700 .78rem var(--body);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--indigo);color:var(--on-indigo)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:.9rem}

.say{display:flex;gap:8px;align-items:stretch}
.say input{flex:1;min-width:0;font:16px var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.mic{width:48px;flex:none;border-radius:12px;border:0;background:var(--gold);color:#1C2540;cursor:pointer;display:grid;place-items:center}
.mic svg{width:22px;height:22px}
.mic.live{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 35%,transparent)}}
.hint{font-size:.8rem;color:var(--muted)}
.hint code{font-family:var(--mono);font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr) 64px repeat(2,1fr);align-items:center}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 .72rem var(--body);color:var(--muted);cursor:pointer;padding:6px 0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--indigo)}
nav.tabs .fab{width:54px;height:54px;border-radius:50%;background:var(--gold);color:#1C2540;justify-self:center;justify-content:center;margin-top:-26px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
nav.tabs .fab svg{width:26px;height:26px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.scrim{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.cp-in,.lg-pane input,.lg-pane select,#lk,#py-m{font:16px var(--body);padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field textarea{font:13px/1.45 var(--mono);min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:13px;font:700 1rem var(--body);cursor:pointer;background:var(--indigo);color:var(--on-indigo)}
.btn.ghost{background:none;color:var(--muted)}
.btn.del{color:var(--bad)}
.btn.del.armed{background:var(--bad);color:#fff}
.hd-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.editlink{font-size:.82rem;padding:2px 0}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.report{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;margin:8px 0}
.report h3{margin:10px 0 2px;font-size:1rem}
.report table{font-size:.8rem;width:100%}
.report th,.report td{padding:6px 4px !important;letter-spacing:0}
.report th{font-size:.62rem}
.report td:first-child{word-break:break-word}
.rp-rows{display:flex;flex-direction:column}
.rp-row{padding:8px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.rp-nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);margin-top:2px}
.rp-nums b{color:var(--ink);font-variant-numeric:tabular-nums}
.rp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rp-brand{font-size:.72rem;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.rp-score{display:flex;align-items:center;gap:4px;background:var(--gold-soft);border-radius:12px;padding:6px 10px;flex:none}
.rp-score b{font-size:1.6rem;line-height:1}.rp-score span{font-size:.72rem;line-height:1.1}
.rp-list{margin:0;padding-left:4px;list-style:none;font-size:.9rem}
.rp-note{font-size:.8rem}
#printArea{display:none}
@media print{
  body.print-report > *:not(#printArea){display:none !important}
  body.print-report #printArea{display:block}
  body.print-report{background:#fff}
  #printArea .report{border:0;padding:0}
  #printArea table{font-size:11pt}
}
.hist-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.hist-row .main{flex:1;min-width:0}
.hist-row .d{font-weight:700;font-size:.9rem}
.hist-row .s{color:var(--muted);font-size:.85rem}
.hist-row .x.armed{background:var(--bad);color:#fff;border-radius:8px}
.recedit{border:0;background:none;color:var(--muted);font-size:1rem;padding:4px 6px;cursor:pointer;margin-left:2px}
.btn.small{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
.sms{display:flex;flex-direction:column;gap:8px}
.sms .msg{background:var(--bg);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:10px 12px;font:12.5px/1.45 var(--mono);overflow-wrap:anywhere;display:flex;flex-direction:column;gap:6px}
.sms .msg .row{display:flex;justify-content:space-between;align-items:center;font-family:var(--body);font-size:.75rem;color:var(--muted)}
.modes button{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:.85rem;padding:10px 2px}
.modes svg{width:18px;height:18px}
.modes{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.modes::-webkit-scrollbar{display:none}
.modes button{min-width:0;flex:1 0 56px;scroll-snap-align:start}
@media (max-width:440px){.modes button{flex-direction:column;gap:2px;font-size:.74rem;padding:6px 2px;}}
.eggbars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px}
.eb em{max-width:100%;overflow:hidden;white-space:nowrap}
.eb{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.72rem}
.eb i{display:block;width:100%;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px}
.eb em{font-style:normal;color:var(--muted)}
.curopt{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.curopt:first-child{border-top:0}
.curopt .code{font-family:var(--mono);font-size:.85rem;font-weight:500}
.curopt .sy{color:var(--muted);font-size:.85rem}
.curopt.on{background:var(--gold-soft)}
.curopt.on .code::before{content:"✓ "}
.cmds{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.84rem}
.cmds code{font-family:var(--mono);font-size:.8rem;font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:.9rem;z-index:11;max-width:calc(100% - 32px);text-align:center}
/* ---------- Bigger screens: tablet and computer ---------- */
nav.tabs .fab-l{display:none}
.side-modes,.side-tools,nav.tabs .side-only{display:none}
.bar-l{display:flex;align-items:center;gap:10px}
.homebtn.on{background:var(--indigo);color:var(--on-indigo);border-color:var(--indigo)}
.theme-l{display:none}
.themebtn{padding:5px 8px}
.acct-l{display:none}
.acctbtn{padding:5px 8px}
.mark{width:56px;height:56px;flex:none}
.login-hd{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.lg-pane{display:flex;flex-direction:column;gap:8px}.lg-pane[hidden],#lg-codew[hidden]{display:none}#lg-codew{display:flex;flex-direction:column;gap:8px}
.lg-pane label{font-weight:700;font-size:.9rem}
.lg-row{display:flex;gap:8px}.lg-row select{flex:0 0 auto;max-width:46%}.lg-row input{flex:1;min-width:0}
.err.ok{color:var(--good)}
.lg-test{background:var(--gold-soft);border-radius:10px;padding:8px 12px;font-size:.85rem}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--gold-soft);color:var(--ink);vertical-align:middle}
.ac-plan{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ac-pn{font:800 1.4rem var(--display);margin:2px 0}
.pl-need{background:var(--gold-soft);border-radius:10px;padding:8px 12px;font-size:.9rem}
.pl-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:8px 0}
@media (min-width:700px){.pl-grid{grid-template-columns:repeat(2,1fr)}}
.pl-card{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.pl-card.pl-hi{border:2px solid var(--gold)}
.pl-card ul{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:3px;flex:1}
.pl-name{font-weight:800;font-size:1.05rem}
.pl-price{font:800 1.6rem var(--display)}.pl-price small{font:600 .85rem var(--body);color:var(--muted)}
.py-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.py-opts .btn{padding-inline:4px;font-size:.85rem}
.py-total{font-size:1.05rem}
.py-bank{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem}
.py-bank span{display:block;color:var(--muted);font-size:.75rem}
a.btn{text-align:center;text-decoration:none;display:block}

.rp-seg{overflow-x:auto;scrollbar-width:none}.rp-seg::-webkit-scrollbar{display:none}.rp-seg button{flex:1 0 auto;padding-inline:8px}
.rp-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}.rp-nav b{text-align:center;font-size:.92rem}.rp-nav button:disabled{opacity:.4;cursor:default}

function applyPrices(){ Object.keys(PTYPES).forEach(k=>{ const T=PTYPES[k]; if(!('_bp' in T)){ T._bp=T.birdPrice??null; T._ep=T.eggPrice??null; }
  const o=(S.prices||{})[k]||{}; if(T._bp!=null||o.bird!=null) T.birdPrice = o.bird ?? T._bp; if(T._ep!=null||o.egg!=null) T.eggPrice = o.egg ?? T._ep; });
  Object.keys(CROPS).forEach(k=>{ const C=CROPS[k]; if(!('_p' in C)) C._p=C.price; C.price = (S.cropPrices||{})[k] ?? C._p; });
  Object.keys(FTYPES).forEach(k=>{ const F=FTYPES[k]; if(!('_p' in F)) F._p=F.price; F.price = (S.fishPrices||{})[k] ?? F._p; });

  Object.keys(FRUITS).forEach(k=>{ const F=FRUITS[k]; if(!('_p' in F)) F._p=F.price; F.price = (S.fruitPrices||{})[k] ?? F._p; }); }

function forecast(){

  const mk = ds => ds.slice(0,7); const find = k => months.find(m=>m.key===k);
  S.plots.forEach(p=>{
    const c=CROPS[p.crop], st=stageOf(p), value=c.yield*p.ha*1000*c.price, sold=plotMoney(p.id).r, rest=Math.max(0,value-sold);
    const when = st.idx===4 ? addDays(14) : addDays(14,new Date(st.harvest+'T12:00:00'));
    const m=find(mk(when)); if(m) m.inn+=rest;
  });
  (S.orchards||[]).forEach(o=>{ const s=orchardStats(o); if(!s.bearing||!s.F.season.length) return;
    const recent=S.records.filter(r=>r.plot===o.id&&r.type==='sale'&&daysSince(r.date)<120).reduce((a,r)=>a+r.amount,0), rest=Math.max(0,s.value-recent);
    const inWin=months.filter(m=>s.F.season.includes(+m.key.slice(5,7))); inWin.forEach(m=>m.inn+=rest/s.F.season.length); });
  (S.flocks||[]).forEach(f=>{ const T=PTYPES[f.type], s=flockStats(f);
    if(isLay(f.type)){ months.forEach((m,i)=>{ const y=+m.key.slice(0,4), mo=+m.key.slice(5,7), dim=new Date(y,mo,0).getDate();
        const startDay = i===0 ? TODAY.getDate() : 1; const layStart=new Date(s.endDate+'T12:00:00');
        let n=0; for(let d=startDay; d<=dim; d++){ if(new Date(y,mo-1,d)>=layStart) n++; }
        const rate = s.idx>=3 && s.lay>0 ? s.lay : T.layRate; m.inn += s.alive*rate*n*T.eggPrice; }); }
    else if(!s.sold && s.alive){ const when = s.toEnd===0 ? addDays(7) : s.endDate; const m=find(mk(when)); if(m) m.inn += s.alive*T.birdPrice; }
  });
  (S.herds||[]).forEach(h=>{ const s=herdStats(h); if(h.type!=='dairy'||!s.milk7) return; const perDay=s.milk7/7*(s.T.milkPrice||0);
    months.forEach((m,i)=>{ const y=+m.key.slice(0,4), mo=+m.key.slice(5,7), dim=new Date(y,mo,0).getDate(); m.inn += perDay*(i===0?dim-TODAY.getDate()+1:dim); }); });
  (S.ponds||[]).forEach(w=>{ const s=pondStats(w); if(!s.alive) return; const when = s.toEnd===0 ? addDays(14) : s.endDate; const m=find(mk(when)); if(m) m.inn += s.value; });
  months[0].out += (S.work||[]).reduce((a,j)=>a+jobOwed(j),0);
  S.loans.forEach(l=>{ const L=loanCalc(l); if(!L.left) return; const k=mk(l.due)<months[0].key?months[0].key:mk(l.due); const m=find(k); if(m) m.out+=L.left; });
  const cbc=costByCat(S.records.filter(r=>entOf(r)==='crop')), cbp=costByCat(S.records.filter(r=>entOf(r)==='poultry')); let remain=0;
  COSTS.forEach(k=>remain+=Math.max(0,((S.budget||{})[k]||0)-(cbc[k]||0))); PCOSTS.forEach(k=>remain+=Math.max(0,((S.budgetP||{})[k]||0)-(cbp[k]||0)));
  const cbf=costByCat(S.records.filter(r=>entOf(r)==='fish')); FCOSTS.forEach(k=>remain+=Math.max(0,((S.budgetF||{})[k]||0)-(cbf[k]||0)));
  const cbl=costByCat(S.records.filter(r=>entOf(r)==='livestock')); LCOSTS.forEach(k=>remain+=Math.max(0,((S.budgetL||{})[k]||0)-(cbl[k]||0)));
  months[0].out+=remain*0.5; months[1].out+=remain*0.5;
  const loansIn = S.loans.reduce((a,l)=>a+l.principal,0), repaid = S.loans.reduce((a,l)=>a+loanCalc(l).paid,0);
  const cash = totals().net + loansIn - repaid;
  let bal=cash; months.forEach(m=>{bal+=m.inn-m.out; m.bal=bal;});
  return {months,cash};
}
function score(){

// Report periods: day / week / month / year (calendar), '12m' rolling, 'all'. off = 0 now, -1 the one before, ...
function periodRange(period, off){

  const I=d=>iso(d);
  if(period==='all') return null;
  if(period==='12m'||period==='12') return {from:addDays(-364), to:I(T0), label:t('period12')};
  if(period==='day'){ const d=new Date(T0); d.setDate(d.getDate()+off); return {from:I(d),to:I(d),label:d.toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})}; }
  if(period==='week'){ const a=new Date(T0); a.setDate(a.getDate()-((a.getDay()+6)%7)+7*off); const b=new Date(a); b.setDate(b.getDate()+6);
    const f=d=>d.toLocaleDateString(loc(),{day:'numeric',month:'short'}); return {from:I(a),to:I(b),label:`${f(a)} – ${f(b)} ${b.getFullYear()}`}; }
  if(period==='month'){ const a=new Date(T0.getFullYear(),T0.getMonth()+off,1,12), b=new Date(a.getFullYear(),a.getMonth()+1,0,12);
    const l=a.toLocaleDateString(loc(),{month:'long',year:'numeric'}); return {from:I(a),to:I(b),label:l.charAt(0).toUpperCase()+l.slice(1)}; }
  const y=T0.getFullYear()+off; return {from:`${y}-01-01`,to:`${y}-12-31`,label:String(y)};
}
const periodLabel = (period, off) => { const r=periodRange(period,off); return r?r.label:t('periodAll'); };
function reportData(period, off){
  const RG = periodRange(period, off);
  const inP = r => !RG || (r.date>=RG.from && r.date<=RG.to);
  const R0 = S.records.filter(inP);
  const parts = [
    ['crops', t('crops'), r=>entOf(r)==='crop' && !orchardById(r.plot)],
    ['fruit', t('myOrchards'), r=>entOf(r)==='crop' && !!orchardById(r.plot)],
    ['poultry', t('poultry'), r=>entOf(r)==='poultry'],
    ['livestock', t('livestock'), r=>entOf(r)==='livestock'],
    ['fish', t('fish'), r=>entOf(r)==='fish']
  ].map(([k,label,f])=>({k,label,...totals(R0.filter(f)),n:R0.filter(f).length})).filter(x=>x.n);
  const all = totals(R0), months = new Set(R0.map(r=>r.date.slice(0,7))).size, days = new Set(R0.map(r=>r.date)).size;
  const short = ['day','week','month'].includes(period), spanDays = RG ? Math.round((new Date(RG.to)-new Date(RG.from))/864e5)+1 : 0;
  const sc = score();
  const units = [];
  S.plots.forEach(p=>{ const m=totals(R0.filter(r=>r.plot===p.id)); const C=CROPS[p.crop]||{}; units.push({name:p.name, what:`${cropName(p.crop)} · ${String(Math.round(p.ha*100)/100).replace('.',S.lang==='fr'?',':'.')} ha`, ...m, value:m.r?null:(C.yield||0)*p.ha*1000*(C.price||0), crop:true}); });
  (S.orchards||[]).forEach(o=>{ const m=totals(R0.filter(r=>r.plot===o.id)); const os=orchardStats(o); units.push({name:o.name, what:`${fruitName(o.fruit)} · ${num(o.trees)} ${t('treesN')}`, ...m, value:os.bearing?os.value:null, crop:true}); });
  (S.flocks||[]).forEach(f=>{ const st=flockStats(f), m=totals(R0.filter(r=>r.plot===f.id)); units.push({name:f.name, what:`${birdName(f.type)} · ${num(st.alive)} ${t('birds')}`, ...m, value:st.sold?0:st.alive*((PTYPES[f.type]||{}).birdPrice||0)}); });
  (S.herds||[]).forEach(h=>{ const st=herdStats(h), m=totals(R0.filter(r=>r.plot===h.id)); units.push({name:h.name, what:`${liveName(h.type)} · ${num(st.head)} ${t('animalsN')}`, ...m, value:st.value}); });
  (S.ponds||[]).forEach(w=>{ const st=pondStats(w), m=totals(R0.filter(r=>r.plot===w.id)); units.push({name:w.name, what:`${fishName(w.sp)} · ${num(st.alive)} ${t('fishN')}`, ...m, value:st.value}); });
  const loans = S.loans.map(l=>{ const L=loanCalc(l); const status = L.left===0 ? t('paidOff') : daysSince(l.due)>0 ? t('repLate') : t('repOnTrack'); return {lender:l.lender, total:L.total, paid:L.paid, left:L.left, due:l.due, status, late:L.left>0&&daysSince(l.due)>0}; });
  const animals = units.reduce((a,u)=>a+(u.value||0),0), equip=(S.equipment||[]).reduce((a,e)=>a+(e.cost||0),0);
  return {recs:R0, parts, all, months, days, short, spanDays, nrec:R0.length, sc, units, loans, animals, equip, period, off:off||0};
}

const HELV_W = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const PDF_MAP = {'–':150,'—':151,'‘':145,'’':146,'“':147,'”':148,'•':149,'…':133,'‹':139,'›':155,'€':128,'−':45};
function pdfChars(s){ const out=[]; for(const ch of String(s)){ let c=PDF_MAP[ch]!=null?PDF_MAP[ch]:ch.codePointAt(0); if(c>255||c<32) continue; out.push(c); } return out; }
function pdfW(s,size,bold){ let w=0; for(const c of pdfChars(s)) w += (c>=32&&c<=126?HELV_W[c-32]:556); return w*size/1000*(bold?1.06:1); }
function pdfEsc(s){ return pdfChars(s).map(c=> c===40||c===41||c===92 ? '\\'+String.fromCharCode(c) : c<128 ? String.fromCharCode(c) : '\\'+c.toString(8).padStart(3,'0')).join(''); }
function pdfFit(s,w,size,bold){ s=plainTxt(s); if(pdfW(s,size,bold)<=w) return s; while(s.length>1 && pdfW(s+'…',size,bold)>w) s=s.slice(0,-1); return s+'…'; }
function pdfWrap(s,w,size,bold){ const words=plainTxt(s).split(/\s+/), lines=[]; let l=''; words.forEach(x=>{ const tt=l?l+' '+x:x; if(pdfW(tt,size,bold)>w && l){ lines.push(l); l=x; } else l=tt; }); if(l) lines.push(l); return lines; }
function makePDF(draw){
  const W=595, H=842, M=44, pages=[]; let ops=[], y;
  const rgb=c=>c.map(v=>(v/255).toFixed(3)).join(' ');
  const P={W,H,M,
    page(){ ops=[]; pages.push(ops); y=H-M; return P; },
    get y(){ return y; }, set y(v){ y=v; },
    need(h){ if(y-h<M+24){ P.page(); return true; } return false; },
    text(x,yy,s,size=10,bold=false,color=[27,35,80],align='left'){ s=plainTxt(s); if(!s) return; const w=pdfW(s,size,bold); const xx=align==='right'?x-w:align==='center'?x-w/2:x;
      ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${rgb(color)} rg ${xx.toFixed(2)} ${yy.toFixed(2)} Td (${pdfEsc(s)}) Tj ET`); },
    rect(x,yy,w,h,color){ ops.push(`${rgb(color)} rg ${x.toFixed(2)} ${yy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); },
    line(x1,y1,x2,y2,color=[213,217,203],lw=0.6){ ops.push(`${rgb(color)} RG ${lw} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`); }
  };
  P.page(); draw(P);
  const n=pages.length, objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  const kids=[];
  pages.forEach((o,i)=>{ const pid=5+i*2, cid=6+i*2; kids.push(pid+' 0 R');
    const foot=`BT /F1 8 Tf 0.42 0.44 0.54 rg ${M} 26 Td (${pdfEsc('Shemiko · '+(i+1)+' / '+n)}) Tj ET`;
    const body=o.concat([foot]).join('\n');
    objs[pid]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cid} 0 R >>`;
    objs[cid]=`<< /Length ${body.length} >>\nstream\n${body}\nendstream`; });
  objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${n} >>`;
  let out='%PDF-1.4\n%âãÏÓ\n'; const offs=[];
  for(let i=1;i<objs.length;i++){ offs[i]=out.length; out+=`${i} 0 obj\n${objs[i]}\nendobj\n`; }
  const xref=out.length; out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+offs.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
  out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255; return bytes;
}

async function saveFile(name, mime, data){
  const bytes = typeof data==='string' ? new TextEncoder().encode(data) : data;
  if(NATIVE && NATIVE.Filesystem && NATIVE.Share){
    let b=''; for(let i=0;i<bytes.length;i+=0x8000) b+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
    const w=await NATIVE.Filesystem.writeFile({path:name, data:btoa(b), directory:'CACHE'});
    await NATIVE.Share.share({title:name, files:[w.uri], dialogTitle:t('rpShare')}); return;
  }
  if(window.claude && typeof window.claude.use==='function'){ let dl=null; try{ dl=await window.claude.use('downloads'); }catch(e){}
    if(dl){ try{ await dl.save({filename:name, data:bytes}); return; }catch(e){ if(e && e.code==='declined'){ const x=new Error('declined'); x.name='AbortError'; throw x; } if(e && !['unavailable','not_granted','capability_disabled','capability_removed'].includes(e.code)) throw e; } } }
  const blob=new Blob([bytes],{type:mime}), a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
}

/* ---------- Sentence / SMS-command parser ---------- */
function parseSentence(raw){
  const s = ' '+raw.toLowerCase().replace(/[’']/g,"'")+' ';
  const has = list => list.some(w => new RegExp('(^|[^a-z0-9à-ÿœ])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^a-z0-9à-ÿœ])').test(s));
  let type = null; const first = s.trim().split(/\s+/)[0];
  if(['dep','spend'].includes(first)) type='cost'; else if(['ven','sell'].includes(first)) type='sale'; else if(['tac','job'].includes(first)) type='task';
  if(!type){
    if(has(['sold','sell','selling','received','got paid','vendu','vendre','vente','reçu','recu','encaissé','avance','advance','deposit'])) type='sale';
    else if(has(['bought','buy','paid','pay','spent','cost','hired','acheté','achete','payé','paye','dépensé','depense','coûté','loué'])) type='cost';
    else if(has(['need to','must','remind','tomorrow','todo','il faut','faut','demain','rappel','à faire','a faire'])) type='task';
  }
  // amounts: "52 000", "52000", "52k", "50 mille"
  let amount=null; const nums=[];
  s.replace(/(\d[\d\s.,]*\d|\d)\s*(k|mille|thousand)?\b/g,(m,n,mult)=>{ let v=parseFloat(n.replace(/[\s.]/g,'').replace(',','.')); if(mult) v*=1000; nums.push({v,unit:/\b(kg|sacs?|bags?|ha)\b/.test(s.slice(s.indexOf(m)+m.length, s.indexOf(m)+m.length+6))}); return m;});
  const money = nums.filter(n=>!n.unit); if(money.length) amount=Math.max(...money.map(n=>n.v));
  let cat=null;
  const order = Object.keys(CATS); if(S.lang==='fr'){ order.splice(order.indexOf('plough'),1); order.unshift('plough'); }
  const kwFor = k => k==='plough'&&S.lang==='fr' ? [...CATS[k].kw,'labour'] : k==='labour'&&S.lang==='fr' ? CATS[k].kw.filter(w=>w!=='labour') : CATS[k].kw;
  for(const k of order) if(has(kwFor(k))){ cat=k; break; }
  if(!cat){ for(const k of order) if(has([CATS[k].code.toLowerCase()])){cat=k;break;} }
  let plot='';
  for(const p of S.plots){ const c=CROPS[p.crop]; if(has([c.en.toLowerCase(),c.fr.toLowerCase(),c.code.toLowerCase(),c.fr.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')])){ plot=p.id; break; } }
  if(!plot) for(const o of (S.orchards||[])){ const F=FRUITS[o.fruit]||FRUITS.other; if(has([o.name.toLowerCase(),(o.kind||'').toLowerCase(),...F.words].filter(Boolean))){ plot=o.id; break; } }
  if(!type) type = amount!=null ? 'cost' : 'task';
  const fw = has([...(S.ponds||[]).flatMap(w=>[w.name.toLowerCase(),(w.kind||'').toLowerCase()]).filter(Boolean),'fish','fishes','tilapia','bream','catfish','fingerling','fingerlings','pond','ponds','poisson','poissons','alevin','alevins','samaki','sato','kambale']);

let rec=null;
// Inside the Android/iOS app, use the phone's own speech recognition (the built-in browser engine has none).
const NATIVE = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor.Plugins : null;
async function startVoiceNative(){
  const SRN=NATIVE.SpeechRecognition, hint=document.getElementById('sayHint'), mic=document.getElementById('mic'), say=document.getElementById('say');
  try{
    const av=await SRN.available(); if(!av || !av.available){ hint.textContent=t('micNo'); return; }
    let p=await SRN.checkPermissions(); if(p.speechRecognition!=='granted') p=await SRN.requestPermissions();
    if(p.speechRecognition!=='granted'){ hint.textContent=t('micDenied'); return; }
    mic.classList.add('live'); hint.textContent=t('listening');
    const r=await SRN.start({language:S.lang==='fr'?'fr-FR':S.lang==='sw'?'sw-TZ':'en-GB', maxResults:1, prompt:t('listening'), partialResults:false, popup:true});
    mic.classList.remove('live'); hint.textContent=t('sayHint');
    const txt=(r && r.matches && r.matches[0]) || '';
    if(txt){ say.value=txt; handleSay(txt); }
  }catch(err){ mic.classList.remove('live'); hint.textContent=t('micNo'); }
}
function startVoice(){
  if(NATIVE && NATIVE.SpeechRecognition) return startVoiceNative();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const hint=document.getElementById('sayHint'), mic=document.getElementById('mic');
  if(!SR){ hint.textContent=t('micNo'); document.getElementById('say').focus(); return; }
  try{
    if(rec){ rec.stop(); return; }
    rec = new SR(); rec.lang = S.lang==='fr'?'fr-FR':S.lang==='sw'?'sw-TZ':'en-GB'; rec.interimResults=true; rec.maxAlternatives=1;
    mic.classList.add('live'); hint.textContent=t('listening');
    rec.onresult = e => { const txt=[...e.results].map(r=>r[0].transcript).join(' '); document.getElementById('say').value=txt; if(e.results[e.results.length-1].isFinal){ handleSay(txt); } };
    rec.onerror = () => { hint.textContent=t('micNo'); };
    rec.onend = () => { mic.classList.remove('live'); rec=null; };
    rec.start();
  }catch(err){ hint.textContent=t('micNo'); mic.classList.remove('live'); rec=null; }
}
function handleSay(txt){

async function verifyLicence(key){
  const m=/^SHM1\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(String(key||'').replace(/\s+/g,'')); if(!m) return {ok:false, why:'bad'};
  if(!(window.crypto && crypto.subtle)) return {ok:false, why:'nocrypto'};
  try{ const pk=await crypto.subtle.importKey('jwk', LIC_PUB, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
    const good=await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, pk, b64u(m[2]), new TextEncoder().encode(m[1]));
    if(!good) return {ok:false, why:'bad'};
    const [p,d,u,e,i]=new TextDecoder().decode(b64u(m[1])).split('|');
    if(!PLANS.includes(p) || !/^\d{8}$/.test(e||'')) return {ok:false, why:'bad'};
    const P={p, d, u, e:`${e.slice(0,4)}-${e.slice(4,6)}-${e.slice(6,8)}`, i};
    if(P.u!=='*' && P.u!==acctId()) return {ok:false, why:'who', P};
    if(P.e<iso(TODAY)) return {ok:false, why:'old', P};
    if(P.d!=='any' && P.d!==devClass()) return {ok:false, why:'dev', P};
    return {ok:true, P};
  }catch(e){ return {ok:false, why:'bad'}; }
}

  const cropPrices={}; rows(sec.N).forEach(r=>{ const k=cropByCode(r[0]); if(k) cropPrices[k]=+r[1]; });
  const stock = rows(sec.S).map((r,i)=>({id:'s'+(i+1),name:r[0],kind:SKINDS[r[1]]?r[1]:'other',unit:SUNITS.includes(r[2])?r[2]:'kg',ent:r[3]||'all',qty:+r[4]||0,low:+r[5]||0,autoFeed:r[6]==='1',logs:[]}));
  return {stock,herds,livePrices,budgetL,orchards,fruitPrices,ponds,fishPrices,budgetF,prices,cropPrices,plots,flocks,records,loans,tasks,budget,budgetP,customCrops,customBirds,typeSeq:customCrops.length+customBirds.length+(S.typeSeq||0)};
}
async function copyText(txt, btn){
  try{ await navigator.clipboard.writeText(txt); btn.textContent=t('copied'); }
  catch(e){ const pre=btn.closest('.msg')?.querySelector('.body'); if(pre){ const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} toast(t('copyFail')); }
}
function backupSheet(){
  const msgs = encode();
  const el=openSheet(`<h2>${t('bkTitle')}</h2>
    <div class="card"><span class="status ${online()?'':'off'}"><i></i>${online()?t('online'):t('offline')}</span><div class="muted">${t('bkIntro')}</div>
      <div class="muted">${t('bkStatus')}: <b>${S.lastBackup?dayLabel(S.lastBackup):t('never')}</b></div></div>
    <section><h2>${t('smsTitle')}</h2><div class="muted">${t('smsIntro')}</div>
      <div class="muted">${t('smsTo')}: <b class="num" style="user-select:all">${t('smsNum')}</b> · ${msgs.length} ${t('msgs')}</div>
      <div class="sms">${msgs.map((m,i)=>`<div class="msg"><div class="row"><span>${t('part')} ${i+1}/${msgs.length}</span><button type="button" class="btn small line" data-copy="${i}">${t('copy')}</button></div><div class="body">${esc(m)}</div></div>`).join('')}</div>
      <button type="button" class="btn" id="markSent">${t('marked')}</button></section>
    <section><h2>${t('cmdTitle')}</h2><div class="muted">${t('cmdIntro')}</div>
      <div class="cmds">${S.lang==='fr'
        ?`<code>DEP 900 ENG MAIS</code><span>${t('cmdSpend')}</span><code>VEN 3400 MAIS</code><span>${t('cmdSell')}</span><code>TAC Traiter le coton</code><span>${t('cmdJob')}</span>`
        :`<code>SPEND 900 FERT MAIZE</code><span>${t('cmdSpend')}</span><code>SELL 3400 MAIZE</code><span>${t('cmdSell')}</span><code>JOB Spray cotton</code><span>${t('cmdJob')}</span>`}</div>
      <div class="hint">${S.lang==='fr'?'Testez une commande dans la case « Dites ou écrivez » de l’accueil.':'Try a command in the box on the Today screen.'}</div></section>
    <section><h2>${t('restoreTitle')}</h2><div class="muted">${t('restoreIntro')}</div>
      <div class="field"><label for="restoreTxt">SMS</label><textarea id="restoreTxt" placeholder="SHM3 1/${msgs.length} …"></textarea></div>
      <div class="err" id="rErr"></div><button type="button" class="btn line" id="doRestore">${t('restore')}</button></section>
    <button type="button" class="btn ghost" data-close>${t('cancel')}</button>`);
  el.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyText(msgs[+b.dataset.copy],b));
  el.querySelector('#markSent').onclick=()=>{ S.lastBackup=iso(TODAY); done(t('markedDone')); };
  el.querySelector('#doRestore').onclick=()=>{ try{ const d=decode(el.querySelector('#restoreTxt').value); Object.assign(S,d,{example:false}); tab='today'; done(t('restored')); } catch(e){ el.querySelector('#rErr').textContent=t('restoreErr'); } };
}

/* ---------- Events ---------- */
let armed=false;
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b || b.closest('.sheet')) return;
  if(b.dataset.tab){ tab=b.dataset.tab; render(); scrollTo(0,0); }
  else if(b.dataset.go){ tab=b.dataset.go; render(); scrollTo(0,0); }
  else if(b.dataset.mode){ if(b.dataset.mode==='coop' && !needPlan('business')) return; S.mode=b.dataset.mode; if(tab==='home') tab='today'; save(); render(); }
  else if(b.dataset.openmode){ S.mode=b.dataset.openmode; tab='today'; save(); render(); scrollTo(0,0); }
  else if(b.id==='homeReport' || b.id==='sideReport') sheet('report');
  else if(b.dataset.log!==undefined) sheet('log', b.dataset.log||null);
  else if(b.dataset.count) sheet('count', b.dataset.count);
  else if(b.dataset.bf){ birdFilter=b.dataset.bf; render(); }
  else if(b.id==='addFlock') sheet('flock');
  else if(b.id==='myPrices') sheet('prices');
  else if(b.id==='cropPrices') sheet('cropPrices');
  else if(b.id==='fishPrices') sheet('fishPrices');
  else if(b.id==='addPond') sheet('pond');
  else if(b.id==='addOrchard') sheet('orchard');
  else if(b.id==='addHerd') sheet('herd');
  else if(animalBtn(b)) {}
  else if(b.id==='addStock') sheet('stock');
  else if(b.dataset.sadd) sheet('smove',{id:b.dataset.sadd,k:'add'});
  else if(b.dataset.suse) sheet('smove',{id:b.dataset.suse,k:'use'});
  else if(b.dataset.scount) sheet('smove',{id:b.dataset.scount,k:'count'});
  else if(b.id==='farmReport') sheet('report');
  else if(b.dataset.hist){ const [k,i]=b.dataset.hist.split('|'); sheet('hist',{k,id:i}); }
  else if(b.dataset.edittask){ const x=S.tasks.find(y=>y.id===b.dataset.edittask); if(x) sheet('task',x); }
  else if(b.dataset.editwork){ const x=(S.work||[]).find(y=>y.id===b.dataset.editwork); if(x) sheet('work',x); }
  else if(b.dataset.edit){ const [k,i]=b.dataset.edit.split('|'); const L={plot:S.plots,flock:S.flocks,herd:S.herds,pond:S.ponds,orchard:S.orchards,worker:S.workers,loan:S.loans,equip:S.equipment,stock:S.stock}[k]||[]; const o=L.find(x=>x.id===i); if(o) sheet(k,o); }
  else if(b.dataset.editrec){ const r=S.records.find(x=>x.id===b.dataset.editrec); if(r) sheet('record',{...r,amount:Math.round(r.amount/kPer(curCode())*100)/100,editId:r.id}); }
  else if(b.id==='livePrices') sheet('livePrices');
  else if(b.dataset.hlog!==undefined) sheet('hlog', b.dataset.hlog||null);
  else if(b.dataset.hcare){ const h=herdById(b.dataset.hcare); if(h){ h.logs.push({date:iso(TODAY),care:true}); save(); render(); toast(t('careSaved')); } }
  else if(b.dataset.oharv) sheet('oharv', b.dataset.oharv);
  else if(b.dataset.flog!==undefined) sheet('flog', b.dataset.flog||null);
  else if(b.dataset.fharvest) sheet('fharvest', b.dataset.fharvest);
  else if(b.id==='manageCrops') sheet('types','crop');
  else if(b.id==='manageBirds') sheet('types','bird');
  else if(b.id==='addWorker') sheet('worker');
  else if(b.dataset.member) sheet('member', b.dataset.member);
  else if(b.id==='addMember') sheet('addMember');
  else if(b.id==='addEquip') sheet('equip');
  else if(b.dataset.service) sheet('service', b.dataset.service);
  else if(b.dataset.cal){ calTab=b.dataset.cal; render(); }
  else if(b.id==='startChk') sheet('startChk');
  else if(b.dataset.chk){ const [rid,i]=b.dataset.chk.split(':'); const r=(S.runs||[]).find(x=>x.id===rid); if(r){ const n=+i; r.checked = r.checked.includes(n) ? r.checked.filter(x=>x!==n) : [...r.checked,n]; const all=r.checked.length>=tplOf(r).items.length; save(); render(); if(all) toast(t('chkDone')); } }
  else if(b.dataset.again){ S.runs=S.runs||[]; S.runs.push({id:id(),tpl:b.dataset.again,ent:S.mode||'crop',date:iso(TODAY),checked:[]}); save(); render(); toast(t('chkStarted')); }
  else if(b.dataset.work!==undefined) sheet('work', b.dataset.work);
  else if(b.dataset.pay!==undefined) sheet('pay', b.dataset.pay);
  else if(b.dataset.lang){ S.lang=b.dataset.lang; save(); render(); }
  else if(b.dataset.fin){ finTab=b.dataset.fin; render(); }
  else if(b.dataset.filter){ moneyFilter=b.dataset.filter; render(); }
  else if(b.dataset.tick){ const x=S.tasks.find(q=>q.id===b.dataset.tick); x.done=!x.done; save(); render(); }
  else if(b.dataset.repay) sheet('repay', b.dataset.repay);
  else if(b.id==='fab') sheet(isC()?'addMember':'record');
  else if(b.id==='addPlot') sheet('plot');
  else if(b.id==='addLoan') sheet('loan');
  else if(b.id==='editBudget') sheet('budget');
  else if(b.id==='bk') sheet('backup');
  else if(b.id==='acctBtn') sheet('account');
  else if(b.id==='themeBtn'){ S.theme = isDark()?'light':'dark'; save(); render(); }
  else if(b.id==='curBtn') sheet('currency');
  else if(b.id==='mic') startVoice();
  else if(b.id==='clear'){
    if(!armed){ armed=true; b.textContent=t('confirmClear'); setTimeout(()=>{armed=false; render();},4000); return; }
    armed=false; S={lang:S.lang,currency:S.currency,mode:S.mode,customCrops:S.customCrops||[],customBirds:S.customBirds||[],prices:S.prices||{},cropPrices:S.cropPrices||{},profile:S.profile||{},stock:[],fishPrices:S.fishPrices||{},ponds:[],budgetF:{},fruitPrices:S.fruitPrices||{},orchards:[],livePrices:S.livePrices||{},herds:[],budgetL:{},typeSeq:S.typeSeq||0,plots:[],flocks:[],records:[],tasks:[],loans:[],workers:[],work:[],equipment:[],runs:[],customTpls:[],budget:{},budgetP:{},example:false,lastBackup:null}; save(); tab='plots'; render(); toast(t('cleared'));
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeSheet();
  if(e.key==='Enter' && e.target.id==='say'){ e.preventDefault(); handleSay(e.target.value); }
});
document.addEventListener('change', e=>{ if(e.target.id==='langSel'){ S.lang=e.target.value; save(); render(); } });
addEventListener('online',render); addEventListener('offline',render);
// Android back button: close an open form first, then go back to Today, then leave the app.
if(NATIVE && NATIVE.App){ NATIVE.App.addListener('backButton', ()=>{
  if(document.querySelector('.sheet')){ closeSheet(); return; }
  if(tab!=='today'){ tab='today'; render(); scrollTo(0,0); return; }
  NATIVE.App.exitApp();
}); }
if(WIDE.matches) tab='home';
setTimeout(()=>{ loadLicence(); if(!S.account && !S.skipLogin) sheet('login'); }, 0);
render();
})();
</script>
